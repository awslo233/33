name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Next.js (static export)
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html not found"
            exit 1
          fi
          echo "out/index.html found: $(wc -c < out/index.html) bytes"

      - name: Add Android platform
        run: npx cap add android || true

      - name: Grant storage permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Original manifest:"
            cat "$MANIFEST"
            # 先清理已存在的存储权限（避免重复）
            sed -i '/WRITE_EXTERNAL_STORAGE/d' "$MANIFEST"
            sed -i '/READ_EXTERNAL_STORAGE/d' "$MANIFEST"
            sed -i '/READ_MEDIA_IMAGES/d' "$MANIFEST"
            # 在 <application 之前插入权限（manifest 根节点级别）
            sed -i 's|<application|    <!-- Storage permissions for export to Download folder -->\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <application|' "$MANIFEST"
            echo "Modified manifest:"
            cat "$MANIFEST"
          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Add FileProvider config for sharing
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 给 application 标签添加 FileProvider（Capacitor 默认会加，但确保有）
          grep -q "FileProvider" "$MANIFEST" || echo "FileProvider already handled by Capacitor"

      - name: Sync web assets & config
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-diary-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
